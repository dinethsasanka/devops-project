name: Build and Deploy to Kubernetes

on:
  push:
    branches: [main]

jobs:

  build-and-push:
    name: Build Docker images and push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Flask web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/notes-web:latest
            ${{ secrets.DOCKER_USERNAME }}/notes-web:${{ github.sha }}

      - name: Build and push Flask API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/notes-api:latest
            ${{ secrets.DOCKER_USERNAME }}/notes-api:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes cluster
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to K8s via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.K8S_HOST }}
          username: ${{ secrets.K8S_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          script: |
            kubectl set image deployment/flask-web-deployment \
              flask-web=${{ secrets.DOCKER_USERNAME }}/notes-web:${{ github.sha }} \
              -n notes-app

            kubectl set image deployment/flask-api-deployment \
              flask-api=${{ secrets.DOCKER_USERNAME }}/notes-api:${{ github.sha }} \
              -n notes-app

            kubectl rollout status deployment/flask-web-deployment \
              -n notes-app --timeout=120s

            kubectl rollout status deployment/flask-api-deployment \
              -n notes-app --timeout=120s