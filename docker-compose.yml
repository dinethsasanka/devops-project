version: '3.8'

services:

  flask:
    build: .
    container_name: flask_app
    restart: always
    environment:
      - DB_HOST=mariadb
      - DB_USER=notesuser
      - DB_PASSWORD=notespass
      - DB_NAME=notesdb
    depends_on:
      - mariadb
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - flask
    networks:
      - app_network

  mariadb:
    image: mariadb:10.11
    container_name: mariadb_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=notesdb
      - MYSQL_USER=notesuser
      - MYSQL_PASSWORD=notespass
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mariadb_data:
